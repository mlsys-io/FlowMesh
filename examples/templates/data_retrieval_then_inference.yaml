# news_html_summary.yaml
# Retrieve news metadata, fetch HTML from S3, and summarize each article.
#
# NOTE: Replace the $PG_* and $S3_* placeholders in the `connection_string`
# fields below with real values before submitting.

apiVersion: flowmesh/v1
kind: InferenceTask
metadata:
  name: data-retrieval-then-inference

spec:
  taskType: "inference"

  graph:
    nodes:
      - name: sql-param-generator
        spec:
          taskType: "inference"
          resources:
            hardware:
              cpu: "2"
              memory: "8GiB"
              gpu:
                type: any
                count: 1
          model:
            source:
              type: "huggingface"
              identifier: "Qwen/Qwen2.5-1.5B-Instruct"
          inference:
            max_tokens: 64
            temperature: 0.0
            templates:
              - name: date
                type: "datetime"
                min: "2024-06-01"
                max: "2025-03-31"
              - name: table_name
                candidates:
                  - "fact_news-metadata"
              - name: limit
                type: "integer"
                min: 1
                max: 10
          data:
            type: "list"
            items:
              - Suggest a starting date and number of news articles for financial news in the first quarter of 2025.
              - Suggest a starting date and number of news articles for financial news in the last quarter of 2024.

      - name: news-metadata
        dependsOn: ["sql-param-generator"]
        spec:
          taskType: "data_retrieval"
          resources:
            hardware:
              cpu: "4"
              memory: "16GiB"
          data:
            type: "sql"
            connection_string: "postgresql://$PG_USER:$PG_PASS@$PG_HOST:$PG_PORT/$PG_DB"
            template: "SELECT id, symbol, \"publishedDate\", title FROM star.\"{table_name}\" WHERE symbol='{symbol}' AND \"publishedDate\" >= '{publishedDateMin}' ORDER BY \"publishedDate\" DESC LIMIT {limit}"
            params:
              - label: symbol
                data:
                  type: list
                  items:
                  - NVDA
              - label: limit
                node: "sql-param-generator"
                path: "items.output.limit"
              - label: publishedDateMin
                node: "sql-param-generator"
                path: "items.output.date"
              - label: table_name
                node: "sql-param-generator"
                path: "items.output.table_name"

      - name: news-html
        dependsOn: ["news-metadata"]
        spec:
          taskType: "data_retrieval"
          resources:
            hardware:
              cpu: "4"
              memory: "16GiB"
          data:
            type: "s3"
            connection_string: "s3://$S3_USER:$S3_PASS@$S3_HOST:$S3_PORT/$S3_BUCKET"
            template: "unstructured/news-html/{id}.html"
            params:
            - label: id
              node: "news-metadata"
              path: "items.table.id"
            encoding: "utf-8"

      - name: summarize
        dependsOn: ["news-metadata", "news-html"]
        spec:
          taskType: "inference"
          resources:
            hardware:
              cpu: "4"
              memory: "16GiB"
              gpu:
                type: any
                count: 1
          model:
            source:
              type: "huggingface"
              identifier: "Qwen/Qwen2.5-1.5B-Instruct"
          inference:
            max_tokens: 512
            temperature: 0.4
            top_p: 0.9
          data:
            type: dataframe
            columns:
              - label: "title"
                node: "news-metadata"
                path: "items.table.title"
              - label: "publishedDate"
                node: "news-metadata"
                path: "items.table.publishedDate"
              - label: "html"
                node: "news-html"
                path: "items.content"
            messages:
              - role: "user"
                content: |
                  Summarize the following news article in three sentences concisely.
                  Title: {title}
                  Published: {publishedDate}
                  HTML:
                  {html}

      - name: aggregation
        dependsOn: ["news-metadata", "summarize"]
        spec:
          taskType: "inference"
          resources:
            hardware:
              cpu: "4"
              memory: "16GiB"
              gpu:
                type: any
                count: 1
          model:
            source:
              type: "huggingface"
              identifier: "Qwen/Qwen2.5-1.5B-Instruct"
          inference:
            max_tokens: 512
            temperature: 0.4
            top_p: 0.9
          data:
            type: graph_template
            template:
              name: format
              columns:
              - label: "df"
                data:
                  type: dataframe
                  columns:
                    - label: "title"
                      node: "news-metadata"
                      path: "items.table.title"
                    - label: "publishedDate"
                      node: "news-metadata"
                      path: "items.table.publishedDate"
                    - label: "summary"
                      node: "summarize"
                      path: "items.output"
              options:
                format:
                  messages:
                  - role: system
                    content: You are a helpful assistant that aggregates news summaries.
                  - role: user
                    content: "Given the following news summaries, generate an aggregated summary that captures the key points from all articles. {df}"

  output:
    destination:
      type: "http"
    artifacts:
      - "results.json"
