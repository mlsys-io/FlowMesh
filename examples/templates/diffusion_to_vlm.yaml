apiVersion: flowmesh/v1
kind: InferenceTask
metadata:
  name: diffusion-to-vlm-pipeline

spec:
  taskType: "inference"

  resources:
    hardware:
      cpu: "8"
      memory: "32Gi"
      gpu:
        count: 1
        type: "any"

  graph:
    nodes:
      - name: diffusion
        spec:
          taskType: diffusion
          
          model:
            source:
              type: "huggingface"
              identifier: "stabilityai/stable-diffusion-3.5-large"
            diffusers:
              dtype: "bf16"
              use_safetensors: true

          inference:
            num_inference_steps: 30
            guidance_scale: 7.5
            height: 512
            width: 512
            num_images_per_prompt: 1
            seed: 42

          data:
            type: "list"
            items:
              - "A futuristic city with flying cars at night, cyberpunk style, high detail"

          output:
            destination:
              type: "http"
            artifacts:
              - "results.json"
              - "images/"

      - name: image-embedding
        dependsOn: ["diffusion"]
        spec:
          taskType: embedding
          
          model:
            source:
              identifier: llava-hf/llava-1.5-7b-hf
            transformers:
              mode: visual-embedding
              trust_remote_code: true

          data:
            type: list
            node: diffusion
            path: images

          output:
            destination:
              type: http
              timeoutSec: 1800
            artifacts:
              - results.json
              - visual_embeddings.pt

      - name: vlm-inference
        dependsOn: ["image-embedding"]
        spec:
          taskType: inference
          
          model:
            source:
              identifier: llava-hf/llava-1.5-7b-hf
            vllm:
              trust_remote_code: true
              enable_mm_embeds: true
              limit_mm_per_prompt:
                image: 1

          data:
            type: graph_template
            template:
              name: format
              options:
                format:
                  messages:
                  - role: user
                    content: Describe the image in detail. What is the overall atmosphere?
            image_embedding: 
              node: image-embedding
              path: embedding_file

          inference:
            max_tokens: 512
            temperature: 0.7

          output:
            destination:
              type: http
            artifacts:
              - results.json
