# api_two_stage.yaml
#
# Two-stage API executor demo.
# Stage 1 calls a chat completion endpoint and returns raw text.
# Stage 2 sends Stage 1's returned text as the next prompt.
#
# Stage 1 names the endpoint explicitly via spec.api.url. Stage 2 omits url
# and model, so it uses the defaults: https://lum.id/llm/v1/chat/completions
# with the deepseek-v4-flash model. Both stages authenticate with the
# worker's own NEBULA_API_TOKEN.

apiVersion: flowmesh/v1
kind: APITask
metadata:
  name: api-two-stage

spec:
  taskType: api

  stages:
    - name: stage-1
      spec:
        api:
          url: https://lum.id/llm/v1/chat/completions
          method: POST
          headers:
            Content-Type: application/json
          body:
            model: deepseek-v4-flash
            messages:
              - role: user
                content: Please explain vector databases in simple terms.
          response:
            parse_json: false
            # return_body is a JSON backdoor: keep raw text when JSON isn't usable.
            return_body: true
            raise_for_status: true

    - name: stage-2
      spec:
        api:
          method: POST
          headers:
            Content-Type: application/json
          body:
            messages:
              - role: user
                content: "The previous stage's response is as follows. Please provide a simpler explanation: \n${stage-1.text}"
          response:
            parse_json: true
            # return_body is a JSON backdoor: keep raw text when JSON isn't usable.
            return_body: true
            raise_for_status: true

  output:
    destination:
      type: http
    artifacts:
      - results.json
