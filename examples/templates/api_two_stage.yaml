# Two-stage API executor demo.
#
# Stage 1 sends one request per spec.data row, filling {{prompt}} in the
# request body. Stage 2 takes the first row's response
# (${stage-1.items.0.text}) and sends it as its own one-row prompt.
#
# Stage 1 names a custom endpoint via spec.api.url and supplies its own
# Authorization header. Stage 2 omits both, so it uses the Nebula defaults
# (NEBULA_API_BASE_URL + NEBULA_API_TOKEN).

apiVersion: flowmesh/v1
kind: APITask
metadata:
  name: api-two-stage

spec:
  taskType: api

  stages:
    - name: stage-1
      spec:
        data:
          type: list
          items:
            - Explain vector databases in simple terms.
            - Explain attention in simple terms.
            - Explain backpropagation in simple terms.
        api:
          url: https://api.example.com/v1/chat/completions
          method: POST
          headers:
            Authorization: Bearer <your-token>
            Content-Type: application/json
          body:
            model: gpt-4o
            messages:
              - role: user
                content: "{{prompt}}"
          response:
            parse_json: true
            return_body: true
            raise_for_status: true

    - name: stage-2
      spec:
        data:
          type: list
          items:
            - "The previous stage's response is as follows. Please provide a simpler explanation: \n${stage-1.items.0.text}"
        api:
          method: POST
          headers:
            Content-Type: application/json
          body:
            model: gpt-4o
            messages:
              - role: user
                content: "{{prompt}}"
          response:
            parse_json: true
            return_body: true
            raise_for_status: true

  output:
    destination:
      type: http
    artifacts:
      - results.json
