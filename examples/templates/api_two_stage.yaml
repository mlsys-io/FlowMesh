# api_two_stage.yaml
#
# Two-stage batched API executor demo.
#
# spec.data is required for an api task and yields one row per request; a
# single request is a one-row list. Each row's prompt is substituted for the
# {{prompt}} placeholder in the request body and one request is issued per
# row, returned row-aligned in APIResult.items. Server-side stage references
# are ${...}; {{prompt}} is a worker-side per-row slot, so it is not touched
# by server-side resolution.
#
# Stage 1 fans out over three rows and calls a chat completion endpoint.
# Stage 2 consumes Stage 1's returned text as the next prompt, so the
# two-stage character is kept while exercising the batch path. A dependent
# stage reads a single upstream value: APIResult is batch-only, so the
# reference addresses one row explicitly (${stage-1.items.0.text} is the
# first row's text), and stage-2's one-row spec.data supplies that value as
# its prompt.

apiVersion: flowmesh/v1
kind: APITask
metadata:
  name: api-two-stage

spec:
  taskType: api

  stages:
    - name: stage-1
      spec:
        data:
          type: list
          items:
            - Explain vector databases in simple terms.
            - Explain attention in simple terms.
            - Explain backpropagation in simple terms.
        api:
          url: https://api.example.com/v1/chat/completions
          method: POST
          headers:
            Authorization: Bearer <your-token>
            Content-Type: application/json
          body:
            model: gpt-4o
            messages:
              - role: user
                content: "{{prompt}}"
          response:
            parse_json: false
            return_body: true
            raise_for_status: true

    - name: stage-2
      spec:
        data:
          type: list
          items:
            - "The previous stage's response is as follows. Please provide a simpler explanation: \n${stage-1.items.0.text}"
        api:
          method: POST
          headers:
            Content-Type: application/json
          body:
            model: gpt-4o
            messages:
              - role: user
                content: "{{prompt}}"
          response:
            parse_json: true
            return_body: true
            raise_for_status: true

  output:
    destination:
      type: http
    artifacts:
      - results.json
