apiVersion: flowmesh/v1
kind: OmniTask
metadata:
  name: omni-text2audio-bgm

spec:
  taskType: omni_text2audio

  resources:
    hardware:
      gpu:
        count: 1
        memory: 16GB

  model:
    source:
      type: huggingface
      identifier: stabilityai/stable-audio-open-1.0

  data:
    type: list
    items:
      - Upbeat electronic music with synth pads and a driving beat

  omni:
    output_format: wav
    sample_rate: 44100
    audio_length: 10.0
    num_waveforms: 1
    guidance_scale: 7.0
    num_inference_steps: 100
    seed: 42
    negative_prompt: Low quality.

  output:
    destination:
      type: http
    artifacts:
      - results.json
      - artifacts/
