apiVersion: flowmesh/v1
kind: OmniTask
metadata:
  name: e2e-omni-text2audio-bgm
  owner: vllm-bump-e2e
  annotations:
    description: vllm-omni text-to-audio smoke.

spec:
  taskType: omni_text2audio

  resources:
    hardware:
      gpu:
        count: 1
        memory: 12GB

  model:
    source:
      type: huggingface
      identifier: stabilityai/stable-audio-open-1.0

  data:
    type: list
    items:
      - Short upbeat electronic music cue with soft synth pads

  omni:
    output_format: wav
    sample_rate: 44100
    audio_length: 1.0
    num_waveforms: 1
    guidance_scale: 7.0
    num_inference_steps: 4
    seed: 42
    negative_prompt: Low quality.

  output:
    destination:
      type: http
    artifacts:
      - results.json
      - artifacts/
