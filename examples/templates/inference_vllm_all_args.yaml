apiVersion: flowmesh/v1
kind: InferenceTask
metadata:
  name: vllm-all-args
  owner: regression-test
  annotations:
    description: Exercise all vLLM engine args and sampling params

spec:
  taskType: inference
  model:
    source:
      type: huggingface
      identifier: Qwen/Qwen3-8B-AWQ    # quantized + Qwen3 chat template (enable_thinking)
      revision: main                # model revision/branch
    vllm:
      # Engine configuration
      quantization: awq               # awq, gptq, fp8, bitsandbytes
      kv_cache_dtype: auto            # auto or fp8 (fp8 saves ~50% KV cache memory)
      enforce_eager: true             # disable CUDA graphs for this test
      swap_space: 4                   # CPU swap space in GB for KV cache offloading
      cpu_offload_gb: 0               # GB of model weights to offload to CPU
      max_model_len: 2048             # cap context length to save memory
      max_num_batched_tokens: 2048    # chunked prefill budget
      gpu_memory_utilization: 0.9     # fraction of GPU memory for KV cache
      dtype: auto                     # model precision (auto, float16, bfloat16)
      tokenizer_revision: main        # tokenizer revision (override if differs from model)
      rope_scaling:                   # RoPE scaling config (via hf_overrides)
        rope_type: dynamic
        factor: 1.0
      rope_theta: 10000.0            # RoPE base frequency (via hf_overrides)
  resources:
    hardware:
      cpu: 4
      memory: 16Gi
      gpu:
        type: any
        count: 1
        memory: 16Gi
  inference:
    # Core sampling
    temperature: 0.8                  # higher = more creative
    top_p: 0.9                        # nucleus sampling cutoff
    top_k: 40                         # top-k filtering
    min_p: 0.05                       # minimum probability threshold
    max_tokens: 128                   # max output length
    min_tokens: 10                    # force at least 10 tokens before stopping
    seed: 42                          # deterministic sampling
    n: 2                        # generate 2 completions, return best
    # Penalties
    repetition_penalty: 1.15          # penalize repeated tokens (>1.0 = more diverse)
    presence_penalty: 0.1             # penalize tokens that appeared at all
    frequency_penalty: 0.1            # penalize tokens proportional to count
    # Stop conditions
    stop:
      - "\n\n"
      - "###"
    stop_token_ids: []                # additional stop token IDs
    bad_words:                        # tokens to suppress entirely
      - fuck
      - shit
    # Output control
    skip_special_tokens: true         # strip <|endoftext|> etc from output
    logprobs: 3                       # return top-3 log probabilities per token
    # Structured output — named fields
    disable_any_whitespace: true      # force compact JSON (default true); set false to allow inter-token whitespace
    templates:
      - name: rating
        type: int
        min: 0
        max: 10
      - name: sentiment
        type: str
        candidates: [positive, negative, neutral]
      - name: published_on
        type: date
        min: 2024-01-01
        max: 2025-12-31
    chat_template_kwargs:
      enable_thinking: false
  data:
    type: list
    items:
      - Explain quantum entanglement in exactly three sentences.
      - Write a haiku about machine learning.
  output:
    destination:
      type: http
      timeoutSec: 120
    artifacts:
      - results.json
