apiVersion: flowmesh/v1
kind: OmniTask
metadata:
  name: omni-text2general-narration

spec:
  taskType: omni_text2general

  resources:
    hardware:
      gpu:
        count: 1
        memory: 120GB

  model:
    source:
      type: huggingface
      identifier: Qwen/Qwen3-Omni-30B-A3B-Instruct

  data:
    type: list
    items:
      - "Please read the following passage in a calm, professional tone: FlowMesh is a distributed GPU workflow engine."

  omni:
    output_format: wav
    sample_rate: 24000
    modalities: audio
    async_chunk: true
    stage_init_timeout: 1800
    init_timeout: 1800
    # Qwen3-Omni's default pipeline spans two GPUs (thinker on cuda:0,
    # talker + code2wav on cuda:1). Collapse it onto a single large-memory
    # card by pinning every stage to device 0 and rebalancing the per-stage
    # memory pools so the three engines coexist (thinker/talker/code2wav =
    # 0.6/0.2/0.1). Drop this block to use the two-GPU default.
    stage_overrides:
      "0":
        devices: "0"
        gpu_memory_utilization: 0.6
      "1":
        devices: "0"
        gpu_memory_utilization: 0.2
      "2":
        devices: "0"
        gpu_memory_utilization: 0.1

  output:
    destination:
      type: http
    artifacts:
      - results.json
      - artifacts/
