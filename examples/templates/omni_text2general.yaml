apiVersion: flowmesh/v1
kind: OmniTask
metadata:
  name: omni-text2general-narration

spec:
  taskType: "omni_text2general"

  resources:
    hardware:
      gpu:
        count: 1
        memory: "24GB"

  model:
    source:
      type: "huggingface"
      identifier: "Qwen/Qwen3-Omni-30B-A3B-Instruct"

  data:
    text: "Please read the following passage in a calm, professional tone: FlowMesh is a distributed GPU workflow engine."

  omni:
    output_format: "wav"
    sample_rate: 24000
    modalities: "audio"
    stage_init_timeout: 600
    init_timeout: 600
    # Inline stage configuration for single-GPU execution.
    stage_configs:
      async_chunk: false
      stage_args:
        - stage_id: 0
          stage_type: llm
          runtime:
            devices: "0"
            max_batch_size: 64
          engine_args:
            model_stage: thinker
            model_arch: Qwen3OmniMoeForConditionalGeneration
            worker_type: ar
            scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
            gpu_memory_utilization: 0.6
            enforce_eager: false
            trust_remote_code: true
            engine_output_type: latent
            distributed_executor_backend: "mp"
            enable_prefix_caching: false
            max_num_batched_tokens: 32768
            hf_config_name: thinker_config
            tensor_parallel_size: 1
          final_output: true
          final_output_type: text
          is_comprehension: true
          default_sampling_params:
            temperature: 0.4
            top_p: 0.9
            top_k: 1
            max_tokens: 2048
            seed: 42
            detokenize: true
            repetition_penalty: 1.05

        - stage_id: 1
          stage_type: llm
          runtime:
            devices: "0"
            max_batch_size: 64
          engine_args:
            model_stage: talker
            model_arch: Qwen3OmniMoeForConditionalGeneration
            worker_type: ar
            scheduler_cls: vllm_omni.core.sched.omni_ar_scheduler.OmniARScheduler
            gpu_memory_utilization: 0.2
            enforce_eager: false
            trust_remote_code: true
            engine_output_type: latent
            enable_prefix_caching: false
            max_num_batched_tokens: 32768
            distributed_executor_backend: "mp"
            hf_config_name: talker_config
          engine_input_source: [0]
          custom_process_input_func: vllm_omni.model_executor.stage_input_processors.qwen3_omni.thinker2talker
          default_sampling_params:
            temperature: 0.9
            top_k: 50
            max_tokens: 4096
            seed: 42
            detokenize: false
            repetition_penalty: 1.05
            stop_token_ids: [2150]

        - stage_id: 2
          stage_type: llm
          runtime:
            devices: "0"
            max_batch_size: 64
          engine_args:
            model_stage: code2wav
            model_arch: Qwen3OmniMoeForConditionalGeneration
            worker_type: generation
            scheduler_cls: vllm_omni.core.sched.omni_generation_scheduler.OmniGenerationScheduler
            enforce_eager: true
            trust_remote_code: true
            async_scheduling: false
            enable_prefix_caching: false
            engine_output_type: audio
            gpu_memory_utilization: 0.1
            distributed_executor_backend: "mp"
            max_num_batched_tokens: 1000000
            hf_config_name: thinker_config
          engine_input_source: [1]
          custom_process_input_func: vllm_omni.model_executor.stage_input_processors.qwen3_omni.talker2code2wav
          final_output: true
          final_output_type: audio
          default_sampling_params:
            temperature: 0.0
            top_p: 1.0
            top_k: -1
            max_tokens: 65536
            seed: 42
            detokenize: true
            repetition_penalty: 1.1

  output:
    destination:
      type: "http"
    artifacts:
      - "results.json"
      - "artifacts/"
