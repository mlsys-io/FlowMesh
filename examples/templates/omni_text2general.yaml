apiVersion: flowmesh/v1
kind: OmniTask
metadata:
  name: e2e-omni-text2general-narration
  owner: vllm-bump-e2e
  annotations:
    description: vllm-omni text-to-general audio smoke.

spec:
  taskType: omni_text2general

  resources:
    hardware:
      gpu:
        count: 2

  model:
    source:
      type: huggingface
      identifier: Qwen/Qwen3-Omni-30B-A3B-Instruct

  data:
    type: list
    items:
      - "Please read this in a calm tone: FlowMesh runs GPU workflows."

  omni:
    output_format: wav
    sample_rate: 24000
    modalities: audio
    stage_init_timeout: 600
    init_timeout: 600

  output:
    destination:
      type: http
    artifacts:
      - results.json
      - artifacts/
