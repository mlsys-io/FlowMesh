# api_batch.yaml
#
# Batched API executor demo: one task issues one HTTP request per row in
# spec.data, returning the responses row-aligned in APIResult.items.
#
# Each row's prompt is substituted for the {{prompt}} placeholder in the
# request body. Server-side stage references are ${...}; {{prompt}} is a
# worker-side per-row slot, so it is not touched by server-side resolution.

apiVersion: flowmesh/v1
kind: APITask
metadata:
  name: api-batch

spec:
  taskType: api

  data:
    type: list
    items:
      - Explain vector databases in simple terms.
      - Explain attention in simple terms.
      - Explain backpropagation in simple terms.

  api:
    method: POST
    headers:
      Content-Type: application/json
    body:
      model: gpt-4o
      messages:
        - role: user
          content: "{{prompt}}"
    response:
      parse_json: true
      return_body: true
      raise_for_status: true

  output:
    destination:
      type: http
    artifacts:
      - results.json
