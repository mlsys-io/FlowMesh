apiVersion: flowmesh/v1
kind: OmniTask
metadata:
  name: e2e-omni-text2image
  owner: vllm-bump-e2e
  annotations:
    description: vllm-omni text-to-image smoke.

spec:
  taskType: omni_text2image

  resources:
    hardware:
      gpu:
        count: 1
        memory: 24GB

  model:
    source:
      type: huggingface
      identifier: Qwen/Qwen-Image-2512

  data:
    type: list
    items:
      - "A small red cube on a white tabletop, simple studio photo"

  omni:
    output_format: png

  output:
    destination:
      type: http
    artifacts:
      - results.json
      - artifacts/
