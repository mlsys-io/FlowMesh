apiVersion: flowmesh/v1
kind: OmniTask
metadata:
  name: omni-text2speech

spec:
  taskType: omni_text2speech

  resources:
    hardware:
      gpu:
        count: 1
        memory: 16GB

  model:
    source:
      type: huggingface
      identifier: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice

  data:
    type: list
    items:
      - "Hello, welcome to FlowMesh. This is a text-to-speech demo."

  omni:
    output_format: wav
    sample_rate: 24000
    speaker: Vivian
    language: Auto

  output:
    destination:
      type: http
    artifacts:
      - results.json
      - artifacts/
