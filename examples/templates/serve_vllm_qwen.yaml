apiVersion: flowmesh/v1
kind: ServeTask
metadata:
  name: serve-vllm-qwen
  annotations:
    description: Serve a Qwen3-0.6B model using vLLM.

spec:
  taskType: serve
  
  resources:
    hardware:
      cpu: 8
      memory: 32Gi
      gpu:
        type: any
        count: 1

  model:
    source:
      type: huggingface
      identifier: Qwen/Qwen3-0.6B
      revision: main
    vllm:
      gpu_memory_utilization: 0.9
      trust_remote_code: true
      max_model_len: 4096

  # How the endpoint is exposed to an external client:
  #   forward — TCP relay through the FlowMesh server (reach it at
  #             server_host:<allocated_port>)
  #   proxy   — HTTP reverse-proxy through the FlowMesh server over the Redis
  #             relay uplink (recommended for workers with no direct network
  #             path to the server, e.g. private cloud GPU nodes; reach it at
  #             <server_base_url>/api/v1/serve/tasks/<task_id>). PAT-exempt:
  #             authenticated solely by this task's apiKey, sent as
  #             `Authorization: Bearer <apiKey>`.
  #   direct  — connect straight to the worker (must be network-reachable)
  accessMode: proxy

  # Pre-set the endpoint API key instead of letting the worker generate a
  # random one, so tests can authenticate with a known key. Omit to
  # auto-generate.
  apiKey: flowmesh-serve-demo-key

  # Task TTL (seconds): the executor tears down the endpoint on expiry.
  ttlSeconds: 3600
