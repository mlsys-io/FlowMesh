apiVersion: flowmesh/v1
kind: OmniTask
metadata:
  name: omni-text2video-minimax-h3

# MiniMax-H3 text-to-video+audio on vLLM-Omni. Point the model at the
# original FL2VA checkpoint directory (not the Diffusers layout); H3 renders
# at a fixed 24 fps, 4-15 s per clip (num_frames is aligned to 17n+5), and
# needs the canvas aspect ratio in extra_args. The MiniMax H3 Community
# License does not cover the US, EU, UK or South Korea.
spec:
  taskType: omni_text2video

  resources:
    hardware:
      gpu:
        count: 1
        memory: 141GB

  model:
    source:
      type: local
      identifier: /data/huggingface/MiniMax-H3-native/FL2VA

  data:
    type: list
    items:
      - >-
        integrated_multimodal_description: [Shot 1] Cinematic, a wide shot at
        dusk over a narrow river in an old town, hundreds of paper lanterns
        drifting on the dark water. The camera pushes in slowly toward a
        small stone bridge. overall_soundscape: gentle water and a soft breeze.

  omni:
    height: 384
    width: 672
    num_frames: 124
    num_inference_steps: 20
    seed: 42
    extra_args:
      aspect_ratio: "16:9"

  output:
    destination:
      type: http
    artifacts:
      - results.json
      - artifacts/
