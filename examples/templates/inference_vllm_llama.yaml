apiVersion: flowmesh/v1
kind: InferenceTask
metadata:
  name: inference-vllm-llama
  owner: alice
  annotations:
    description: "Run text-generation inference using vLLM (TinyLlama-1.1B-Chat model from Hugging Face) on the GSM8K dataset."

spec:
  taskType: "inference"

  # Resource requirements used by the orchestrator scheduler
  resources:
    hardware:
      cpu: "8"
      memory: "32Gi"
      gpu:
        type: "any"         # or a specific model, e.g. "nvidia-a100-80gb"
        count: 1

  # Model configuration and vLLM runtime options
  model:
    source:
      type: "huggingface"
      identifier: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
      revision: "main"
    vllm:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.9
      trust_remote_code: true

  # Data resource
  data:
    type: "dataset"
    url: "openai/gsm8k"
    name: "main"
    split: "train[:1%]"
    column: "question"
    shuffle: true
    seed: 42

  # Inference parameters (vLLM accepts max_tokens)
  inference:
    max_tokens: 128
    temperature: 0.7
    top_p: 0.95

  # Output configuration (current worker writes locally to RESULTS_DIR/<task_id>/results.json)
  output:
    destination:
      type: "local"
    artifacts:
      - "results.json"
      - "logs"
