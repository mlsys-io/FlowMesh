name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0.
        required: true
        type: string
      publish_target:
        description: Package index to publish to.
        required: true
        type: choice
        default: testpypi
        options:
          - testpypi
          - pypi
      package_pattern:
        description: Comma-separated globs of dist filenames to publish (default '*' = all six distributions). Used to stagger initial PyPI Trusted Publisher onboarding when the pending-publisher quota is below 6. Patterns are split on commas, so individual patterns cannot contain a literal comma.
        required: false
        type: string
        default: '*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  PUBLISH_TARGET: ${{ github.event_name == 'release' && 'pypi' || inputs.publish_target }}
  PACKAGE_PATTERN: ${{ github.event_name == 'release' && '*' || inputs.package_pattern }}

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $RELEASE_TAG is not reachable from origin/main"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.8"

      - name: Install build environment
        run: uv sync --all-packages --group dev --frozen

      - name: Validate release versions
        run: uv run scripts/ci/check_release_version.py --tag "$RELEASE_TAG"

      - name: Build distributions
        run: uv build --all-packages --out-dir dist

      - name: Check distribution metadata
        run: uvx twine==6.2.0 check dist/*

      - name: Verify distributions
        run: uv run scripts/ci/check_package_build.py --dist dist

      - name: Filter distributions
        if: env.PACKAGE_PATTERN != '*'
        run: |
          uv run scripts/ci/filter_distributions.py \
            --dist dist \
            --pattern "$PACKAGE_PATTERN"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: flowmesh-dist-${{ env.RELEASE_TAG }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'pypi' || inputs.publish_target }}
    permissions:
      contents: read  # Required to download release metadata and workflow artifacts.
      id-token: write  # Required for PyPI Trusted Publishing via OIDC.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: flowmesh-dist-${{ env.RELEASE_TAG }}
          path: dist/

      - name: Publish to TestPyPI
        if: env.PUBLISH_TARGET == 'testpypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: env.PUBLISH_TARGET == 'pypi'
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1
        with:
          packages-dir: dist/
