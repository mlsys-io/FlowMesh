name: Package Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-build:
    name: Build and smoke-test packages
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11.8"

      - name: Install build environment
        run: uv sync --all-packages --group dev --frozen

      - name: Build distributions
        run: uv build --all-packages --out-dir dist

      - name: Verify root wheel is metadata-only
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("flowmesh-*-py3-none-any.whl"))
          with ZipFile(wheel) as zf:
              bad = [
                  name
                  for name in zf.namelist()
                  if name.split("/", 1)[0] in {"server", "shared", "worker"}
              ]
          if bad:
              raise SystemExit(
                  "root flowmesh wheel contains runtime source: " + ", ".join(bad[:5])
              )
          PY

      - name: Smoke-test umbrella extras
        run: |
          root_wheel="$(ls dist/flowmesh-*-py3-none-any.whl)"

          uv run python -m venv /tmp/flowmesh-sdk-smoke
          /tmp/flowmesh-sdk-smoke/bin/python -m pip install --upgrade pip
          /tmp/flowmesh-sdk-smoke/bin/python -m pip install --find-links dist "${root_wheel}[sdk]"
          /tmp/flowmesh-sdk-smoke/bin/python -c "import flowmesh"

          uv run python -m venv /tmp/flowmesh-hook-smoke
          /tmp/flowmesh-hook-smoke/bin/python -m pip install --upgrade pip
          /tmp/flowmesh-hook-smoke/bin/python -m pip install --find-links dist "${root_wheel}[hook]"
          /tmp/flowmesh-hook-smoke/bin/python -c "import flowmesh_hook"

          uv run python -m venv /tmp/flowmesh-cli-smoke
          /tmp/flowmesh-cli-smoke/bin/python -m pip install --upgrade pip
          /tmp/flowmesh-cli-smoke/bin/python -m pip install --find-links dist "${root_wheel}[cli]"
          /tmp/flowmesh-cli-smoke/bin/flowmesh --help
