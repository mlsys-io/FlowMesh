name: security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Zizmor (workflow audit)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7
        with:
          version: "0.11.8"
      - name: Run zizmor
        # Persona is ``pedantic`` — strictest level whose findings are
        # actually addressable. ``auditor`` adds the
        # ``self-hosted-runner`` audit, which flags every job using
        # self-hosted infra; that's an unfixable architectural choice
        # for this project, not a bug.
        run: uvx --from zizmor==1.24.1 zizmor --persona pedantic --format github .github/workflows
