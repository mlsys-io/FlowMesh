name: security

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Zizmor (workflow audit)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11.8"
      - name: Run zizmor
        # Persona is ``pedantic`` — strictest level whose findings are
        # actually addressable. ``auditor`` adds the
        # ``self-hosted-runner`` audit, which flags every job using
        # self-hosted infra; that's an unfixable architectural choice
        # for this project, not a bug.
        run: uvx --from zizmor==1.24.1 zizmor --persona pedantic --format github .github/workflows

  gitleaks:
    name: Gitleaks (secrets scan)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          # gitleaks scans the full git history for secrets; needs the
          # repo's commit graph, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        # Binary, not gitleaks-action — the action gates on a paid license for org repos.
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner

  bandit:
    name: Bandit (Python source audit)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11.8"
      - name: Run bandit
        run: uvx bandit==1.9.4 -c pyproject.toml -r src/

  pip-audit:
    name: pip-audit (dependency CVE scan)
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11.8"
      - name: Run pip-audit (server)
        run: |
          uvx pip-audit==2.9.0 --strict \
            -r src/server/requirements.txt
      - name: Run pip-audit (worker CPU)
        run: |
          uvx pip-audit==2.9.0 --strict \
            --ignore-vuln GHSA-69w3-r845-3855 \
            --ignore-vuln GHSA-cfh3-3jmp-rvhc \
            --ignore-vuln GHSA-whj4-6x5x-4v2j \
            --ignore-vuln GHSA-wjx4-4jcj-g98j \
            --ignore-vuln GHSA-5xmw-vc9v-4wf2 \
            --ignore-vuln GHSA-r73j-pqj5-w3x7 \
            --ignore-vuln GHSA-pwv6-vv43-88gr \
            --ignore-vuln GHSA-vfmq-68hx-4jfw \
            -r src/worker/requirements/requirements.txt
      - name: Run pip-audit (worker GPU delta)  # no --strict: flashinfer-jit-cache is unauditable on PyPI
        run: |
          uvx pip-audit==2.9.0 \
            --ignore-vuln GHSA-69w3-r845-3855 \
            --ignore-vuln GHSA-cfh3-3jmp-rvhc \
            --ignore-vuln GHSA-whj4-6x5x-4v2j \
            --ignore-vuln GHSA-wjx4-4jcj-g98j \
            --ignore-vuln GHSA-5xmw-vc9v-4wf2 \
            --ignore-vuln GHSA-r73j-pqj5-w3x7 \
            --ignore-vuln GHSA-pwv6-vv43-88gr \
            --ignore-vuln GHSA-vfmq-68hx-4jfw \
            --ignore-vuln GHSA-pf3h-qjgv-vcpr \
            --ignore-vuln GHSA-pq5c-rjhq-qp7p \
            --ignore-vuln GHSA-3mwp-wvh9-7528 \
            --ignore-vuln GHSA-hpv8-x276-m59f \
            --ignore-vuln GHSA-39mp-8hj3-5c49 \
            --ignore-vuln GHSA-h3h8-3v2v-rg7m \
            --ignore-vuln GHSA-jmh7-g254-2cq9 \
            --ignore-vuln GHSA-pfjf-5gxr-995x \
            --ignore-vuln GHSA-w8v5-vhqr-4h9v \
            -r src/worker/requirements/requirements.gpu.txt
