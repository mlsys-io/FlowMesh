name: Release Images

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify and retag :latest, for example v0.1.0.
        required: true
        type: string
      force_latest:
        description: Bypass downgrade-protection guard on the :latest retag.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
  FORCE_LATEST: ${{ github.event_name == 'release' && 'false' || inputs.force_latest }}
  FLOWMESH_REGISTRY: ghcr.io/mlsys-io

jobs:
  verify:
    name: Verify published images
    runs-on: self-hosted
    outputs:
      is_release_tag: ${{ steps.check.outputs.is_release_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $RELEASE_TAG is not reachable from origin/main"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.8"

      - name: Install verification environment
        run: uv sync --all-packages --group dev --frozen

      - name: Verify images
        id: check
        run: |
          uv run scripts/ci/check_image_release.py \
            --tag "$RELEASE_TAG" \
            --commit "$(git rev-parse HEAD)" \
            --registry "$FLOWMESH_REGISTRY" \
            --markdown-file digest-table.md \
            --github-output "$GITHUB_OUTPUT"

      - name: Job summary
        run: cat digest-table.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest table
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: flowmesh-image-digests-${{ env.RELEASE_TAG }}
          path: digest-table.md
          if-no-files-found: error

  retag-latest:
    name: Retag images as :latest
    needs: verify
    if: needs.verify.outputs.is_release_tag == 'true'
    runs-on: self-hosted
    environment: ghcr
    permissions:
      contents: write  # gh release edit appends the digest table to the Release body.
      packages: write  # docker buildx imagetools create writes :latest tags on GHCR.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          version: "0.11.8"

      - name: Install retag environment
        run: uv sync --all-packages --group dev --frozen

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Retag :latest
        run: |
          force_args=()
          if [ "$FORCE_LATEST" = "true" ]; then
            force_args+=(--force)
          fi
          uv run scripts/ci/retag_image_release.py \
            --tag "$RELEASE_TAG" \
            --registry "$FLOWMESH_REGISTRY" \
            "${force_args[@]}"

      - name: Download digest table
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: flowmesh-image-digests-${{ env.RELEASE_TAG }}
          path: .

      - name: Append digest table to Release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run scripts/ci/append_release_digests.py \
            --tag "$RELEASE_TAG" \
            --digest-file digest-table.md
