name: zizmor

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.5.3
        with:
          inputs: .github/workflows
          persona: regular
          # No GitHub Advanced Security on this repo — surface findings via
          # inline workflow annotations instead of SARIF upload.
          advanced-security: false
          annotations: true
          # Per-rule ignores live in .github/zizmor.yml (auto-loaded).
          config: .github/zizmor.yml
