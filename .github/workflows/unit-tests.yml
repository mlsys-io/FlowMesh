name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: [self-hosted, cuda]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run unit tests
        # Skip the multiprocessing GPU-cleanup test — it's too costly to
        # run on every PR (vllm engine startup + multi-process cleanup).
        run: >
          uv run pytest tests/
          --ignore=tests/worker/test_mp_executor_cleanup_gpu.py
          -v
