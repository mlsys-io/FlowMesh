name: Unit Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: [self-hosted, cuda]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11.8"

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run unit tests
        # Skip the multiprocessing GPU-cleanup test — it's too costly to
        # run on every PR (vllm engine startup + multi-process cleanup).
        run: >
          uv run pytest tests/
          --ignore=tests/worker/test_mp_executor_cleanup_gpu.py
          -v
