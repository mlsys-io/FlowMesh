name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        # Skip GPU-probing extras — vllm / flashinfer / bitsandbytes /
        # deepspeed segfault on import in a no-GPU container.
        run: uv sync --all-extras --no-extra inference-gpu --no-extra training-gpu --frozen

      - name: Run unit tests
        # Skip the multiprocessing GPU-cleanup test — the self-hosted
        # runner container has no GPU access.
        run: >
          uv run pytest tests/
          --ignore=tests/worker/test_mp_executor_cleanup_gpu.py
          -v
