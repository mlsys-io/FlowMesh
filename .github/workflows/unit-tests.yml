name: Unit Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.11.26"

      - name: Install dependencies
        run: uv sync --all-packages --group ci --frozen

      - name: Run unit tests
        # Skip the multiprocessing GPU-cleanup test — it's too costly to
        # run on every PR (vllm engine startup + multi-process cleanup).
        run: >
          uv run pytest tests/
          --ignore=tests/worker/test_mp_executor_cleanup_gpu.py
          -v
