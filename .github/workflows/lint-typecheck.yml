name: Lint / Format / Typecheck

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Run pre-commit
        run: uv run pre-commit run --all-files
