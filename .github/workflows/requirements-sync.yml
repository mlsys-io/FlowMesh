name: Requirements Sync Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify worker requirements sync
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9  # v7
        with:
          version: "0.11.8"

      - name: Install workspace (no extras needed — script shells out to `uv export`)
        run: uv sync --frozen

      - name: Verify worker requirements files are in sync with pyproject.toml
        run: uv run scripts/dev/sync_requirements.py
