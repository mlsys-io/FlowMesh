name: Requirements Sync Check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.8"

      - name: Install workspace (no extras needed — script shells out to `uv export`)
        run: uv sync --frozen

      - name: Verify worker requirements files are in sync with pyproject.toml
        run: uv run scripts/dev/sync_requirements.py
