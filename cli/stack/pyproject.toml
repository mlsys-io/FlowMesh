[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmesh-cli-stack"
version = "0.1.8"
description = "FlowMesh CLI stack commands"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "flowmesh-cli==0.1.8",
    "flowmesh-sdk-stack==0.1.8",
    "docker>=7.1.0",
    "packaging>=24",
    "pyyaml>=6.0.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flowmesh_cli_stack" = [
    "assets/**",
    "assets/.env.example",
]
