syntax = "proto3";

package supervisor.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/empty.proto";

// Supervisor streams tasks to workers and accepts events from them.
service Supervisor {
  // Register a worker and return its worker id + auth token.
  rpc RegisterWorker(RegisterRequest) returns (RegisterResponse);
  // Stream tasks assigned to a worker token.
  rpc StreamTasks(google.protobuf.Empty) returns (stream DispatchMessage);
  // Accept a stream of worker/task events for relay to the supervisor.
  rpc PushEvents(stream EventMessage) returns (google.protobuf.Empty);
  // Accept a stream of task-scoped logs for relay to the supervisor.
  rpc PushLogs(stream LogMessage) returns (google.protobuf.Empty);
  // Read a cross-task data payload from the node-local cache.
  rpc FetchData(FetchDataRequest) returns (FetchDataResponse);
  // Publish a cross-task data payload to the node-local cache.
  rpc PublishData(PublishDataRequest) returns (PublishDataResponse);
}

// Worker registration payload.
message RegisterRequest {
  // Worker metadata (JSON-shaped struct).
  google.protobuf.Struct meta = 1;
}

// Worker registration response.
message RegisterResponse {
  string worker_id = 1;
  string api_key = 2;
}

// Interrupt payload emitted by the supervisor.
message InterruptMessage {
  string task_id = 1;
  string reason = 2;
}

// Graceful stop payload emitted by the supervisor.
message StopMessage {
  string task_id = 1;
  string reason = 2;
}

// Task payload emitted by the supervisor.
message TaskMessage {
  // Task data, currently a JSON-shaped struct.
  google.protobuf.Struct payload = 1;
}

// Dispatch envelope emitted by the supervisor.
message DispatchMessage {
  oneof payload {
    // Task message.
    TaskMessage task = 1;
    // Interrupt signal for an already-dispatched task.
    InterruptMessage interrupt = 2;
    // Graceful stop signal for an active task.
    StopMessage stop = 3;
  }
}

// Worker/task event payload sent to the supervisor.
message EventMessage {
  // Event data, currently a JSON-shaped struct.
  google.protobuf.Struct payload = 1;
}

// Worker/task log payload sent to the supervisor.
message LogMessage {
  // Log data, currently a JSON-shaped struct.
  google.protobuf.Struct payload = 1;
}

// Lookup request for a cross-task data payload.
message FetchDataRequest {
  // Producing task id (the data_id namespace).
  string data_id = 1;
}

// Lookup response. `found=false` means cache miss; consumers should fall back
// to the durable HTTP results endpoint on the server.
message FetchDataResponse {
  bool found = 1;
  bytes payload = 2;
}

// Publish request for a cross-task data payload.
message PublishDataRequest {
  // Producing task id (the data_id namespace).
  string data_id = 1;
  // Serialized payload bytes (JSON, encoded by the producer).
  bytes payload = 2;
  // Cache TTL in seconds. Zero disables expiry.
  uint32 ttl_sec = 3;
}

// Publish response. `ok=false` indicates a non-fatal cache write failure;
// the producer's durable HTTP upload is the source of truth and proceeds
// regardless.
message PublishDataResponse {
  bool ok = 1;
}
