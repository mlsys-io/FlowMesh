apiVersion: flowmesh/v1
kind: SFTTask
metadata:
  name: tinyllama-sft-multi-gpu
  owner: research
  annotations:
    description: "Multi-GPU SFT smoke (TinyLlama 1.1B, ZeRO-2 auto-config)."

spec:
  taskType: "sft"

  resources:
    replicas: 1
    hardware:
      cpu: "8"
      memory: "32Gi"
      gpu:
        count: 2
        type: "any"
        memory: "16Gi"

  model:
    source:
      type: "huggingface"
      identifier: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

  data:
    dataset_name: "openai/gsm8k"
    config_name: "main"
    split: "train[:5%]"
    prompt_column: "question"
    response_column: "answer"
    separator: "\n\nAnswer: "
    max_samples: 64

  training:
    allow_multi_gpu: true
    num_train_epochs: 1
    batch_size: 2
    gradient_accumulation_steps: 4
    learning_rate: 5.0e-5
    max_seq_length: 512
    logging_steps: 5
    save_strategy: "no"
    save_model: false
    gradient_checkpointing: true
    packing: false
    fp16: false
    bf16: true

  output:
    destination:
      type: "http"
    artifacts:
      - "results.json"
