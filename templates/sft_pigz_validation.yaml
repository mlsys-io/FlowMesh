# sft_pigz_validation.yaml
#
# Minimal SFT run to validate that archive_model_dir uses the pigz path in a
# rebuilt worker image. Uses a tiny random-weights GPT-2 model on CPU so the
# whole run completes in ~1 minute.
#
# To confirm pigz is actually invoked (not just the Python tarfile fallback),
# exec into the worker container after submitting and run: which pigz
#
# Usage:
#   flowmesh workflow submit templates/sft_pigz_validation.yaml
#   flowmesh workflow watch <wfl-id>
#   flowmesh result download <tsk-id> --include all -o bundle.tgz

apiVersion: flowmesh/v1
kind: SFTTask
metadata:
  name: sft-pigz-validation
  owner: dev
  annotations:
    description: "Minimal SFT run to validate pigz checkpoint archiving"

spec:
  taskType: "sft"

  resources:
    replicas: 1
    hardware:
      cpu: "2"
      memory: "4Gi"

  model:
    source:
      type: "huggingface"
      identifier: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"

  data:
    dataset_name: "openai/gsm8k"
    config_name: "main"
    split: "train[:1%]"
    prompt_column: "question"
    response_column: "answer"
    separator: "\n\nAnswer: "
    max_samples: 10

  training:
    allow_multi_gpu: false
    num_train_epochs: 1
    batch_size: 2
    gradient_accumulation_steps: 1
    learning_rate: 5.0e-5
    max_seq_length: 128
    logging_steps: 1
    save_steps: 500
    save_model: true
    gradient_checkpointing: false
    packing: false
    fp16: false
    bf16: true

  output:
    destination:
      type: "http"
    artifacts:
      - "results.json"
      - "artifacts/checkpoints"
