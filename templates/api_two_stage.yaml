# api_two_stage.yaml
#
# Two-stage API executor demo.
# Stage 1 calls a chat completion endpoint and returns raw text.
# Stage 2 sends Stage 1's returned text as the next prompt.
#
# NOTE: Replace $API_TOKEN in the Authorization headers below with a real
# bearer token before submitting. The host does not expand environment
# variables.

apiVersion: flowmesh/v1
kind: APITask
metadata:
  name: api-two-stage

spec:
  taskType: "api"

  stages:
    - name: stage-1
      spec:
        api:
          url: "https://llm.ai-nebula.com/v1/chat/completions"
          method: "POST"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer $API_TOKEN"
          body:
            model: "gpt-4o"
            messages:
              - role: "user"
                content: "Please explain vector databases in simple terms."
          response:
            parse_json: false
            # return_body is a JSON backdoor: keep raw text when JSON isn't usable.
            return_body: true
            raise_for_status: true

    - name: stage-2
      spec:
        api:
          url: "https://llm.ai-nebula.com/v1/chat/completions"
          method: "POST"
          headers:
            Content-Type: "application/json"
            Authorization: "Bearer $API_TOKEN"
          body:
            model: "gpt-4o"
            messages:
              - role: "user"
                content: "The previous stage's response is as follows. Please provide a simpler explanation: \n${stage-1.text}"
          response:
            parse_json: true
            # return_body is a JSON backdoor: keep raw text when JSON isn't usable.
            return_body: true
            raise_for_status: true

  output:
    destination:
      type: "http"
    artifacts:
      - "results.json"
