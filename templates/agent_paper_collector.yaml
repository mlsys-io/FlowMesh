apiVersion: flowmesh/v1
kind: AgentTask
metadata:
  name: academic-paper-collector
  owner: researcher
  annotations:
    description: "Agent example that summarizes supplied paper notes without external search tools"

spec:
  taskType: "agent"

  configName: "base"

  task: |
    Summarize these paper notes in three concise bullets:
    - Reinforcement learning agents can learn decision policies from reward signals.
    - Tool-using language agents combine planning, retrieval, and action execution.
    - Evaluation should measure task success, robustness, and safety constraints.

  resources:
    replicas: 1
    hardware:
      cpu: "4"
      memory: "8Gi"
      gpu:
        type: "any"
        count: 0

  agent:
    timeout: 300 # 5 minutes

  output:
    destination:
      type: "local"
    artifacts:
      - "results.json"             # FlowMesh standard output format
      - "agent_output.txt"         # Agent execution log
      - "paper_summary.md"         # Paper search results
