apiVersion: flowmesh/v1
kind: TrainingTask
metadata:
  name: tinyllama-ppo-multi-gpu
  owner: research
  annotations:
    description: "Multi-GPU PPO smoke (TinyLlama 1.1B via torchrun)."

spec:
  taskType: "ppo"

  resources:
    replicas: 1
    hardware:
      cpu: "16"
      memory: "64Gi"
      gpu:
        type: "any"
        count: 2
        memory: "32Gi"

  model:
    source:
      type: "huggingface"
      identifier: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
      revision: "main"
      trust_remote_code: false
    config:
      bf16: true
      device_map_auto: false

  reward_model:
    identifier: "cardiffnlp/twitter-roberta-base-sentiment-latest"
    type: "sentiment"

  data:
    prompts:
      - "Write a helpful and positive response to: How can I improve my productivity?"
      - "Create a motivational message for someone learning to code:"
      - "Explain quantum computing in an encouraging way:"
      - "Write a positive review for a local business:"
      - "Describe the benefits of exercise in an inspiring tone:"
      - "Give advice on maintaining work-life balance:"
      - "Explain the importance of continuous learning:"
      - "Write about the benefits of teamwork:"

  training:
    allow_multi_gpu: true
    learning_rate: 3.0e-6
    batch_size: 1
    mini_batch_size: 1
    gradient_accumulation_steps: 1
    steps: 16
    ppo_epochs: 2
    target_kl: 0.1
    seed: 42
    padding_side: "left"
    early_stopping: false
    optimize_cuda_cache: true
    save_strategy: "no"
    save_model: false
    save_freq: 25
    log_with: null
    tracker_project_name: "tinyllama-ppo-multi-gpu"

  generation:
    max_new_tokens: 128
    temperature: 0.7
    do_sample: true

  output:
    destination:
      type: "local"
    artifacts:
      - "results.json"
      - "logs"
      - "artifacts/checkpoints"
