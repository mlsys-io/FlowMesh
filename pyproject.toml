[project]
name = "flowmesh"
version = "0.1.0"
description = "FlowMesh: A Multi-tenant Service Fabric for LLM Agentic Workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# ── Service-level ------------───────────────────────────────------
server = [
    "aiohttp>=3.13.3",
    "cryptography>=46.0.3",
    "docker>=7.1.0",
    "fastapi>=0.120.3",
    "grpcio>=1.76.0",
    "httpx>=0.28.1",
    "protobuf>=5.29.6",
    "pydantic>=2.12.3",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "redis>=7.0.1",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.32.1",
    "vastai-sdk>=0.2.5",
    "websockets>=15.0.1",
]
worker-core = [
    "colorama>=0.4.6",
    "colorlog>=6.9.0",
    "docker>=7.1.0",
    "grpcio>=1.76.0",
    "httpx>=0.28.1",
    "nvidia-ml-py>=13.580.82",
    "protobuf>=5.29.6",
    "python-dotenv>=1.1.1",
    "websocket-client>=1.9.0",
]

# ── Executor capability (CPU-runnable) ────────────────────────────
inference = [
    "accelerate>=1.12.0",
    "datasets>=4.3.0",
    "diffusers>=0.36.0",
    "pillow>=11.3.0",
    "torch>=2.10.0",
    "transformers>=4.57.6",
]
training = [
    "peft>=0.17.1",
    "trl>=0.23.0",
]
rag = [
    "fastembed>=0.7.3,<0.8",
    "qdrant-client>=1.15.1",
]

# ── Executor capability (GPU-only deltas) ─────────────------------
inference-gpu = [
    "bitsandbytes>=0.49.2",
    "flashinfer-python>=0.6.6",
    "vllm==0.18.0",
    "vllm-omni==0.18.0",
]
training-gpu = [
    "deepspeed>=0.18.1",
]

# ── Agent executor ------------------------------------------------
agent = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.13.3",
    "art>=6.5",
    "arxiv>=2.2.0",
    "beautifulsoup4>=4.14.3",
    "chunkr-ai>=0.3.7",
    "crawl4ai>=0.7.8",
    "ddgs>=9.10.0",
    "google-genai>=1.47.0",
    "hydra-core>=1.3.2",
    "ipython>=9.5.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.6",
    "mcp>=1.20.0",
    "openai>=2.9.0",
    "openai-agents>=0.7.0",
    "opencv-python-headless>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pexpect>=4.9.0",
    "prompt-toolkit>=3.0.52",
    "pymupdf>=1.26.5",
    "rich>=14.2.0",
    "sqlmodel>=0.0.27",
    "tiktoken>=0.12.0",
    "toml>=0.10.2",
    "wikipedia-api>=0.8.1",
]
# Agent tracing
observability = [
    "arize-phoenix-client>=1.21.0",
    "arize-phoenix-otel>=0.13.1",
    "openinference-instrumentation-openai>=0.1.39",
    "openinference-instrumentation-openai-agents>=1.3.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-instrumentation>=0.59b0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-semantic-conventions>=0.59b0",
]

# ── Worker-side data connectors -----------------------------------
analytics = [
    "boto3>=1.41.5",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.2.12",
    "sqlalchemy>=2.0.44",
]

# ── Developer tooling ─────────────────────────────────────────────
dev = [
    "black>=25.12.0",
    "boto3-stubs>=1.42.14",
    "codespell>=2.4.1",
    "grpcio-tools>=1.71.2",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "nvidia-ml-py>=13.580.82",
    "pandas-stubs>=2.3.3.251219",
    "pip>=25.3",
    "pre-commit>=4.5.1",
    "protoletariat>=3.3.10",
    "psutil>=7.1.2",
    "pyarrow-stubs>=20.0.0.20251215",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.14.10",
    "types-colorama>=0.4.15.20250801",
    "types-docker>=7.1.0.20251202",
    "types-grpcio>=1.0.0.20251009",
    "types-pexpect>=4.9.0.20250916",
    "types-protobuf>=6.32.1.20251210",
    "types-psutil>=7.1.3.20251211",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
]

# ── Workspace aliases ─────────────────────────────────────────────
cli = ["flowmesh-cli[stack]"]
sdk = ["flowmesh-sdk", "flowmesh-sdk-stack"]

[project.scripts]
flowmesh = "flowmesh_cli.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
lint.select = ["E", "F", "UP", "I"]
lint.ignore = ["I001"]
extend-exclude = ["__init__.pyi", "*_pb2*"]

[tool.mypy]
python_version = "3.12"
files = [
    "src",
    "cli/src",
    "cli/stack/src",
    "sdk/src",
    "sdk/stack/src",
    "tests",
]
ignore_missing_imports = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "datasets",
    "worker.executors.*",
    "worker.runner",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pynvml", "vllm_omni.*"]
follow_untyped_imports = true

[tool.codespell]
skip = "*.lock,*.csv,*.tsv,*.jsonl"
ignore-words-list = "pre-select"

# bandit runs with no severity/confidence threshold; we skip individual rules
# below with documented rationales rather than hiding findings via #nosec.
[tool.bandit]
skips = [
    # B101: assert. Internal invariant checks; the worker / server are not
    # shipped with -O so asserts run. Replacing with raise would clutter
    # internal paths where the precondition cannot fail under normal control
    # flow.
    "B101",
    # B102: exec. Used in worker sandboxes (agent code execution toolkit /
    # Python executor) where running user-supplied code is the feature.
    # Sandbox isolation lives at the container boundary, not in the call
    # site.
    "B102",
    # B104: hardcoded 0.0.0.0 bind. Server / worker entrypoints intentionally
    # listen on all interfaces inside their containers; network exposure is
    # controlled by the container/orchestration layer.
    "B104",
    # B107: hardcoded password default. The flagged default is a placeholder
    # for a config field that must be overridden in any non-test deployment;
    # it is not used as a real credential.
    "B107",
    # B110: try/except/pass. Used in best-effort cleanup, optional metric
    # collection, and shutdown paths where any failure is intentionally
    # swallowed to avoid masking the original error.
    "B110",
    # B112: try/except/continue. Same reasoning as B110, in iteration
    # contexts where one bad input must not abort the loop.
    "B112",
    # B311: pseudo-random generators. Used only for non-cryptographic
    # purposes (sampling, jitter, tie-breaking). No security boundary
    # depends on randomness here.
    "B311",
    # B307: eval. Confined to the agent Python executor toolkit, where
    # evaluating user expressions is the feature. The guarantee is the
    # sandbox container, not the call site.
    "B307",
    # B404: subprocess module imports. Remaining importers are the
    # SFT/DPO/PPO trainer executors (torchrun launchers, deferred — replacing
    # them needs a meaningful rewrite of the distributed-training entry
    # path) and the model-archive packer (optional `pigz`/`tar`
    # acceleration with a python-tarfile fallback). Auditing the imports
    # themselves does not add signal beyond auditing the call sites
    # (B603/B607), which we keep enabled.
    "B404",
    # B603: subprocess.run with a list argument. Allowed because each
    # call site uses an argv list (no shell=True) with controlled
    # arguments; we audit the individual call sites manually.
    "B603",
    # B615: huggingface_hub downloads without a pinned revision. Models /
    # datasets are user-supplied workflow inputs; pinning is the user's
    # call, not ours. The framework cannot meaningfully pin on their
    # behalf.
    "B615",
]

[tool.uv.sources]
flowmesh-cli = { workspace = true }
flowmesh-cli-stack = { workspace = true }
flowmesh-sdk = { workspace = true }
flowmesh-sdk-stack = { workspace = true }

[tool.uv.workspace]
members = ["cli", "cli/stack", "sdk", "sdk/stack"]
