[project]
name = "flowmesh"
version = "0.1.0"
description = "FlowMesh: A Multi-tenant Service Fabric for LLM Agentic Workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# ── Service-level ------------───────────────────────────────------
server = [
    "aiohttp>=3.13.4",
    "cryptography>=46.0.7",
    "docker>=7.1.0",
    "fastapi>=0.120.3",
    "flowmesh-hook",
    "grpcio>=1.76.0",
    "httpx>=0.28.1",
    "lumid-hooks @ git+https://github.com/mlsys-io/lumid.hooks.git@60e383bc73926f0622e0188379d84b9f1f45b7d8",
    "protobuf>=5.29.6",
    "pydantic>=2.12.3",
    "python-multipart>=0.0.26",
    "pyyaml>=6.0.2",
    "redis>=7.0.1",
    "requests>=2.33.0",
    "uvicorn[standard]>=0.32.1",
    "vastai-sdk>=0.2.5",
    "websockets>=15.0.1",
]
worker-core = [
    "colorama>=0.4.6",
    "colorlog>=6.9.0",
    "docker>=7.1.0",
    "grpcio>=1.76.0",
    "httpx>=0.28.1",
    "nvidia-ml-py>=13.580.82",
    "protobuf>=5.29.6",
    "python-dotenv>=1.2.2",
    "websocket-client>=1.9.0",
]

# ── Executor capability (CPU-runnable) ────────────────────────────
inference = [
    "accelerate>=1.12.0",
    "datasets>=4.3.0",
    "diffusers>=0.36.0",
    "pillow>=11.3.0",  # held <12 by gradio 5.50 (transitive via vllm-omni)
    "torch>=2.10.0",
    "transformers>=4.57.6",  # held at 4.57 by vllm/vllm-omni 0.18 compatibility
]
training = [
    "peft>=0.17.1",
    "trl>=0.23.0",
]
rag = [
    "fastembed>=0.7.3,<0.8",
    "qdrant-client>=1.15.1",
]

# ── Executor capability (GPU-only deltas) ─────────────------------
inference-gpu = [
    "bitsandbytes>=0.49.2",
    "flashinfer-python>=0.6.6",
    "vllm==0.18.0",  # pinned with transformers 4.57; 0.19+ needs transformers 5.x
    "vllm-omni==0.18.0",  # follows vllm pin
]
training-gpu = [
    "deepspeed>=0.18.1",
]

# ── Agent executor ------------------------------------------------
agent = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.13.4",
    "art>=6.5",
    "arxiv>=2.2.0",
    "beautifulsoup4>=4.14.3",
    "chunkr-ai>=0.3.7",
    "crawl4ai>=0.8.0",
    "ddgs>=9.10.0",
    "google-genai>=1.47.0",
    "hydra-core>=1.3.2",
    "ipython>=9.5.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.6",
    "mcp>=1.23.0",
    "openai>=2.9.0",
    "openai-agents>=0.7.0",
    "opencv-python-headless>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pexpect>=4.9.0",
    "prompt-toolkit>=3.0.52",
    "pymupdf>=1.26.7",
    "rich>=14.2.0",
    "sqlmodel>=0.0.27",
    "tiktoken>=0.12.0",
    "toml>=0.10.2",
    "wikipedia-api>=0.8.1",
]
# Agent tracing
observability = [
    "arize-phoenix-client>=1.21.0",
    "arize-phoenix-otel>=0.13.1",
    "openinference-instrumentation-openai>=0.1.39",
    "openinference-instrumentation-openai-agents>=1.3.0",
    "opentelemetry-api>=1.38.0",
    "opentelemetry-instrumentation>=0.59b0",
    "opentelemetry-sdk>=1.38.0",
    "opentelemetry-semantic-conventions>=0.59b0",
]

# ── Worker-side data connectors -----------------------------------
analytics = [
    "boto3>=1.41.5",
    "pandas>=2.3.3",
    "psycopg[binary]>=3.2.12",
    "sqlalchemy>=2.0.44",
    "lumid-data-sdk @ git+https://github.com/mlsys-io/lumid.data.git@a800051#subdirectory=sdk",
]

# ── Developer tooling ─────────────────────────────────────────────
dev = [
    "black>=25.12.0",
    "boto3-stubs>=1.42.14",
    "codespell>=2.4.1",
    "grpcio-tools>=1.71.2",
    "isort>=7.0.0",
    "mypy>=1.19.1",
    "nvidia-ml-py>=13.580.82",
    "pandas-stubs>=2.3.3.251219",
    "pip>=25.3",
    "pre-commit>=4.5.1",
    "protoletariat>=3.3.10",
    "psutil>=7.1.2",
    "pyarrow-stubs>=20.0.0.20251215",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.14.10",
    "types-colorama>=0.4.15.20250801",
    "types-docker>=7.1.0.20251202",
    "types-grpcio>=1.0.0.20251009",
    "types-pexpect>=4.9.0.20250916",
    "types-protobuf>=6.32.1.20251210",
    "types-psutil>=7.1.3.20251211",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20250913",
]

# ── Workspace aliases ─────────────────────────────────────────────
cli = ["flowmesh-cli[stack]"]
sdk = ["flowmesh-sdk", "flowmesh-sdk-stack"]
hook = ["flowmesh-hook"]

[project.scripts]
flowmesh = "flowmesh_cli.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.isort]
profile = "black"

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
lint.select = ["E", "F", "UP", "I"]
lint.ignore = ["I001"]
extend-exclude = ["__init__.pyi", "*_pb2*"]

[tool.mypy]
python_version = "3.12"
files = [
    "src",
    "cli/src",
    "cli/stack/src",
    "hook/src",
    "sdk/src",
    "sdk/stack/src",
    "tests",
]
ignore_missing_imports = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "datasets",
    "worker.executors.*",
    "worker.runner",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pynvml", "vllm_omni.*", "deepspeed.*", "lumid_data.sdk"]
follow_untyped_imports = true

[tool.codespell]
skip = "*.lock,*.csv,*.tsv,*.jsonl"
ignore-words-list = "pre-select"

[tool.bandit]
skips = [
    "B101",  # assert: internal invariants, not shipped with -O
    "B102",  # exec: agent Python executor sandbox feature
    "B104",  # 0.0.0.0 bind: containerized; exposure controlled at orchestration
    "B107",  # password default: placeholder, not a real credential
    "B110",  # try/except/pass: best-effort cleanup paths
    "B112",  # try/except/continue: iteration over partially-bad inputs
    "B307",  # eval: agent Python executor sandbox feature
    "B311",  # random: non-cryptographic sampling / jitter / tie-breaking
    "B404",  # subprocess module import: actual unsafe patterns caught by B602/B603/B607
    "B615",  # unpinned hf_hub downloads: user-supplied workflow inputs
]

[tool.uv.sources]
flowmesh-cli = { workspace = true }
flowmesh-cli-stack = { workspace = true }
flowmesh-hook = { workspace = true }
flowmesh-sdk = { workspace = true }
flowmesh-sdk-stack = { workspace = true }

[tool.uv.workspace]
members = ["cli", "cli/stack", "hook", "sdk", "sdk/stack"]
