[project]
name = "flowmesh"
version = "0.1.8rc1"
description = "FlowMesh: A Multi-tenant Service Fabric for LLM Agentic Workflows"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
# Public PyPI install surface.
sdk = ["flowmesh-sdk==0.1.8rc1"]
cli = ["flowmesh-cli[stack]==0.1.8rc1"]
hook = ["flowmesh-hook==0.1.8rc1"]
all = [
    "flowmesh-cli[stack]==0.1.8rc1",
    "flowmesh-hook==0.1.8rc1",
    "flowmesh-sdk==0.1.8rc1",
]

[dependency-groups]
# Runtime/container dependencies.
runtime-server = [
    "aiohttp>=3.14.0",
    "cryptography>=48.0.1",
    "docker>=7.1.0",
    "fastapi>=0.135.0",
    "flowmesh-hook",
    "grpcio>=1.76.0",
    "httpx>=0.28.1",
    "lumid-hooks>=0.2.0",
    "protobuf>=5.29.6",
    "pydantic>=2.12.3",
    "python-multipart>=0.0.31",
    "pyyaml>=6.0.2",
    "redis>=7.0.1",
    "requests>=2.33.0",
    "uvicorn[standard]>=0.32.1",
    "vastai-sdk>=0.2.5",
    "websockets>=15.0.1",
]
runtime-worker-core = [
    "colorama>=0.4.6",
    "colorlog>=6.9.0",
    "docker>=7.1.0",
    "grpcio>=1.76.0",
    "httpx>=0.28.1",
    "nvidia-ml-py>=13.580.82",
    "protobuf>=5.29.6",
    "python-dotenv>=1.2.2",
    "websocket-client>=1.9.0",
]
runtime-inference = [
    "accelerate>=1.12.0",
    "datasets>=4.7.0",
    "diffusers>=0.38.0",
    "pillow>=12.3.0",
    "torch>=2.11.0",
    "transformers>=5.5.1,<5.9.0",
]
runtime-training = [
    "peft>=0.18.0",
    "trl>=1.6.0",
]
runtime-rag = [
    "fastembed>=0.8.0",
    "qdrant-client>=1.15.1",
]
runtime-inference-gpu = [
    "bitsandbytes>=0.49.2",
    "flashinfer-python==0.6.12",
    "vllm==0.24.0",
    "vllm-omni==0.24.0",
]
runtime-training-gpu = [
    "deepspeed>=0.19.1",
]
runtime-agent = [
    "aiofiles>=24.1.0",
    "aiohttp>=3.14.0",
    "art>=6.5",
    "arxiv>=2.2.0",
    "beautifulsoup4>=4.14.3",
    "chunkr-ai>=0.3.7",
    "crawl4ai>=0.9.0",
    "ddgs>=9.10.0",
    "google-genai>=1.47.0",
    "hydra-core>=1.3.2",
    "ipython>=9.5.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.6",
    "mcp>=1.28.1",
    "openai>=2.9.0",
    "openai-agents>=0.7.0",
    "opencv-python-headless>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pexpect>=4.9.0",
    "prompt-toolkit>=3.0.52",
    "pymupdf>=1.26.7",
    "rich>=14.2.0",
    "sqlmodel>=0.0.27",
    "tiktoken>=0.12.0",
    "toml>=0.10.2",
    "wikipedia-api>=0.8.1",
]
runtime-observability = [
    "arize-phoenix-client>=1.21.0",
    "arize-phoenix-otel>=0.13.1",
    "openinference-instrumentation-openai>=0.1.39",
    "openinference-instrumentation-openai-agents>=1.3.0",
    "opentelemetry-api>=1.38.0",
